name: bump-neovim-versions

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compute new matrix line
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          line=$(gh api repos/neovim/neovim/releases --paginate \
            --jq '[.[] | select(.prerelease|not) | .tag_name | select(test("^v[0-9]"))]
                  | map({tag: ., parts: (.[1:] | split(".") | map(tonumber))})
                  | group_by(.parts[0:2]) | map(max_by(.parts))
                  | sort_by(.parts) | reverse | .[0:3] | map(.tag) + ["nightly"]
                  | map("'\''" + . + "'\''") | "[" + join(", ") + "]"')
          echo "line=$line" >> "$GITHUB_OUTPUT"

      - name: update workflow
        run: |
          sed -i -E "s/(neovim_version: )\[.*\]/\1${{ steps.compute.outputs.line }}/" \
            .github/workflows/main.yml

      - uses: peter-evans/create-pull-request@v6
        with:
          branch: bump-neovim-versions
          commit-message: 'ci: bump tested Neovim versions'
          title: 'ci: bump tested Neovim versions'
          body: |
            Updates the test matrix to the latest three stable Neovim releases (plus nightly).

            Auto-generated by `.github/workflows/bump-neovim-versions.yml`.
